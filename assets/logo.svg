<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Himalayan Night / Luxury Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Warm Golden Himalayan Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Machapuchare / Annapurna Mountain Shading Gradient -->
    <linearGradient id="mountainLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="mountainRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="8" />

  <!-- Outer Ring Detail -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Himalayan Sunrise Sun -->
  <circle cx="256" cy="190" r="82" fill="url(#sunGrad)" opacity="0.95" filter="url(#glow)" />

  <!-- Background Hill Silhouette (Phewa Ridge) -->
  <path d="M 60 380 Q 160 260 256 280 T 452 380 Z" fill="rgba(30, 41, 59, 0.7)" />

  <!-- Twin Mountain Peak (Machapuchare Fishtail Inspired) -->
  <!-- Left Ridge -->
  <polygon points="256,120 120,350 256,350" fill="url(#mountainLeft)" opacity="0.95" />
  <!-- Right Ridge -->
  <polygon points="256,120 256,350 392,350" fill="url(#mountainRight)" opacity="0.95" />
  
  <!-- Secondary Snow Peak (Left Wing) -->
  <polygon points="175,200 90,350 175,350" fill="url(#mountainLeft)" opacity="0.75" />
  <!-- Secondary Snow Peak (Right Wing) -->
  <polygon points="337,200 337,350 422,350" fill="url(#mountainRight)" opacity="0.75" />

  <!-- Stylized Modern Apartment Arch / Keyhole Base (Symbolizing Home & Hospitality) -->
  <!-- Architectural Gable / Studio Roof Line -->
  <path d="M 170 380 L 256 305 L 342 380" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Warm Glowing Window / Hearth -->
  <rect x="236" y="335" width="40" height="45" rx="6" fill="#fbbf24" />
  <line x1="256" y1="335" x2="256" y2="380" stroke="#0f172a" stroke-width="4" />
  <line x1="236" y1="357" x2="276" y2="357" stroke="#0f172a" stroke-width="4" />

  <!-- Warm Horizon Base Glow Line -->
  <path d="M 90 400 L 422 400" stroke="url(#sunGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Subtle 9 Stars (Symbolizing the 9 Studio Apartments) -->
  <g fill="#fbbf24" opacity="0.85">
    <circle cx="136" cy="425" r="4" />
    <circle cx="166" cy="425" r="4" />
    <circle cx="196" cy="425" r="4" />
    <circle cx="226" cy="425" r="4" />
    <circle cx="256" cy="425" r="6" fill="#f59e0b" />
    <circle cx="286" cy="425" r="4" />
    <circle cx="316" cy="425" r="4" />
    <circle cx="346" cy="425" r="4" />
    <circle cx="376" cy="425" r="4" />
  </g>
</svg>

