name: Sync Airbnb photos

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-airbnb-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Refresh Airbnb galleries
        run: python3 scripts/sync_airbnb_photos.py

      - name: Validate site data
        run: |
          node --check js/data.js
          node --check js/main.js
          python3 scripts/validate_site.py

      - name: Commit updated galleries
        run: |
          if git diff --quiet -- js/data.js index.html sitemap.xml; then
            echo "No photo changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js index.html sitemap.xml
          git commit -m "Update Airbnb listing photos"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to push updated galleries after 3 attempts." >&2
          exit 1
